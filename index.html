<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Утилиты</title>
<style>
  :root { --dark:#1B3459; --blue:#3977D5; --muted:#4A5D7A; --border:#D5DFEE; --bg:#F5F8FD; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --dark:#E6EDF7; --blue:#6EA1EE; --muted:#9FB0C8; --border:#2E3B50; --bg:#121821; --card:#18202C; } }
  body { margin: 0; background: var(--bg); color: var(--dark); font: 16px/1.55 Inter, system-ui, -apple-system, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 40px 16px; }
  h1 { font-size: 26px; margin: 0 0 20px; }
  a.card { display: block; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; color: inherit; text-decoration: none; margin-bottom: 12px; }
  a.card:hover { border-color: var(--blue); }
  a.card b { color: var(--blue); font-size: 17px; }
  a.card span { display: block; color: var(--muted); font-size: 14px; margin-top: 4px; }
</style>
</head>
<body>
<main>
  <h1>Утилиты</h1>
  <a class="card" href="telegram-ids.html">
    <b>Telegram: ID чатов и тем</b>
    <span>По токену бота находит ID групп, тем, каналов и личных чатов и отправляет тестовое сообщение.</span>
  </a>
</main>
</body>
</html>
